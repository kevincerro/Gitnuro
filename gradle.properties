kotlin.code.style=official
isLinuxAarch64=false
useCross=false
isRustRelease=true
kotlin.daemon.jvmargs=-Xmx4g

# KSP + Compose + hot reload need more metaspace than Gradle default (it ran out with "OutOfMemoryError: Metaspace")
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# Skips the check that rejects Homebrew's JDK for packaging (the JDK is used as-is, at your own risk)
compose.desktop.packaging.checkJdkVendor=false
